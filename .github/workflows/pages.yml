name: pages

# One site: main → /  other origin branches → /preview/<slug>/
# Deploy only from main (or manual dispatch). Feature-branch and delete
# events kick a main rebuild so a stale branch artifact cannot overwrite live Pages.
# github-pages environment: no branch restriction (needed for Actions Pages).

on:
  push:
  delete:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'kvnloo/aodl' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prune deleted remotes
        run: git fetch --prune origin
      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"
      - name: Set up Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build every branch catalog
        run: python3 scripts/build-pages.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.repository == 'kvnloo/aodl' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  kick-main:
    if: github.repository == 'kvnloo/aodl' && github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild the full catalog from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
